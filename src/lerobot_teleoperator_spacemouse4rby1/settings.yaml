# RB-Y1 SpaceMouse 텔레옵 설정. 실행 전에 값을 바꿔서 쓴다.
# 키를 빠뜨리거나 모르는 키가 있으면 시작할 때 오류로 멈춘다.

# 주요설정 파라미터
robot_address: "127.0.0.1:50051" # 로봇 주소. 127.0.0.1:50051은 시뮬레이터, 192.168.30.1:50051은 UPC에서의 사용 IP.
unlimited_mode: false # 로봇 구동 시 enable 대신 unlimit쓸지 여부
impedance_enabled: true # 임피던스 활성화 여부. true면 Cartesian 임피던스 제어, false면 Cartesian 위치 제어
use_gripper: false # 가상에선 false로 테스트. 실물에선 true
max_gripper_open: 1000 # 그리퍼를 열었을 때 벌어지는 정도. 0(닫힘)~1000(열림)
ui_enabled: true 
log_enabled: false # true 시 logs/ 폴더에 저장
tcp_offset_m: [0.0, 0.0, -0.11] # 역기구학 기준점(TCP) [m]. 그리퍼 몸통(ee_right/ee_left) 좌표계에서의 위치.
main_arm: right # 트래킹·미러링 시 기준이 되는 팔
ready_pose_deg:
  torso: [0.0, -15.79, 36.58, -0.79, 0.0, 0.0]
  right_arm: [-10.0, -55.0, -30.0, -105.0, -100.0, 100.0, 150.0]
  left_arm: [-10.0, 55.0, 30.0, -105.0, 100.0, 100.0, -150.0]
ready_minimum_time_s: 5.0

# Cartesian 공통 파라미터
linear_velocity: 0.08 # [m/s]
angular_velocity: 0.5 # [rad/s]
linear_acceleration: 1.0 # [m/s^2] 임피던스 제어에서 사용
angular_acceleration: 4.0 # [rad/s^2] 임피던스 제어에서 사용
acceleration_limit_scaling: 0.8 # 0~1, 위치 제어에서 사용
command_minimum_time_s: 0.1
elbow_limit_rad: [-2.6, -0.5]
align_velocity: 0.03 # 축 정렬(키보드 x, y, z)로 따르는 팔이 움직이는 속도 [m/s]. 0보다 크고 linear_velocity 이하.
# 위치제어 전용 파라미터
max_target_lead_m: 0.01 # 목표 선행 한도(위치 제어). 목표는 실제 자세보다 이만큼까지만 앞설 수 있다. (제어 주기는 코드에서 100 Hz로 고정)
max_target_lead_rad: 0.35
# 임피던스 제어 전용 파라미터
arm_stiffness: [150.0, 150.0, 150.0, 150.0, 150.0, 150.0, 150.0]
arm_torque_limit: [40.0, 40.0, 40.0, 30.0, 30.0, 30.0, 30.0]
arm_damping_ratio: 1.0
impedance_max_target_lead_m: 0.05
impedance_max_target_lead_rad: 0.5
# 막힘 판단(위치 제어). 목표가 선행 한도까지 앞서 있는데 실제 TCP가 입력 방향으로 명령 속도의 이 비율도 못 가는 채
# 0.3초가 지나면 막힌 것으로 보고, 그 방향 입력을 멈춘다(손을 떼거나 방향을 바꾸면 풀림). 막힌 방향으로 계속 밀면 팔이 흔들린다.
# 크게 하면 일찍 멈춰 덜 흔들리지만 덜 가고, 작게 하면 더 가지만 더 흔들린다. 0이면 끈다(관절 한도 안내 로그도 안 나옴).
stall_progress_ratio: 0.3

# 충돌관련 파라미터
collision_check_enabled: false
collision_distance_m: 0.01
collision_release_margin_m: 0.005 # 막힌 뒤에는 이 거리만큼 더 멀어져야 풀린다. (경계에서 막힘/풀림 반복 방지)

# 마우스 관련 파라미터
deadzone: 0.05 # 마우스 입력 무시 최소값 
axis_filter_ratio: 0.3 # 입력의 비율이  일정치 이하인 축은 무시. 0이면 끈다.
translation_curve_temperature: 10.0 # 비선형 감도. 조금 밀면 아주 천천히, 끝까지 밀면 최대 속도. 0이면 커브없음
rotation_curve_temperature: 6.0


